<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button id = "rock">Rock</button>
    <button id = "paper">Paper</button>
    <button id = "scissors">Scissors</button>

    <div id="message">
    Press a button to start!
    </div>
 
    <span id ="score">

    </span>

    <script>

        const message = document.querySelector ("#message")

        message.setAttribute("style", "margin-top: 10px; font-weight: bold; color: #333;");

        let humanScore = 0;
        let computerScore = 0;
    
    
        function getComputerChoice() {
         let randomNumber = Math.random();
        
         if (randomNumber <0.33) {
            return "rock";
         } else if (randomNumber < 0.66) {
            return "paper";
         } else {
            return "scissors";
         }
        }
        console.log(getComputerChoice())


        function playRound(playerChoice, computerChoice) {
          
            if (playerChoice === computerChoice) {
                return "it's a tie!";
            } else if (
            (playerChoice === "rock" && computerChoice === "scissors") ||
            (playerChoice === "paper" && computerChoice === "rock") ||
            (playerChoice === "scissors" && computerChoice === "paper") 
        ) {
            humanScore++;
            return "You win!";
        } else {
            computerScore++;
            return "You lose!";
        }
    }
        
        const rockBtn = document.querySelector("#rock")
        const paperBtn = document.querySelector("#paper")
        const scissorsBtn = document.querySelector("#scissors")

        const messageDisplay = document.querySelector("#message");
        const scoreDisplay = document.querySelector("#score");

        function updateUI(msg) {
        messageDisplay.textContent = msg;
        scoreDisplay.textContent = `My score: ${humanScore} | Computer score: ${computerScore}`;
        }

        function handleTurn(playerSelection) {
            const computerSelection = getComputerChoice();
            const result = playRound(playerSelection, computerSelection);

            updateUI(`You chose ${playerSelection}, computer chose ${computerSelection}. ${result}`);
            checkForWinner();

    
        console.log ("You chose" + playerSelection);
        console.log ("Computer chose" + computerSelection)
        console.log(result);
        console.log ("Score -> Your: " + humanScore + " | Computer: " + computerScore);

        }

        rockBtn.addEventListener("click", () => handleTurn("rock"));
        paperBtn.addEventListener("click", () => handleTurn("paper"));
        scissorsBtn.addEventListener("click", () => handleTurn("scissors"));
    

   function checkForWinner() {
    if (humanScore === 5) {
        updateUI("Game Over: You are the ultimate champion!");
         resetGame();
    } else if (computerScore === 5) {
        updateUI("Game Over: The machines have won.");
         resetGame();
    }
}

function resetGame () {
    humanScore = 0;
    computerScore = 0;
    console.log("Game reset. Scores back to 0.");
}





</script>
</body>
</html>
